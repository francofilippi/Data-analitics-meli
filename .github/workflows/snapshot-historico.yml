name: Snapshot histórico

# Congela en el repo (data/historico/) los meses guardados en Supabase, como
# respaldo durable del YoY. Corre mensualmente y a demanda.
#
# Requiere el secret DATABASE_URL en el repo (Settings → Secrets and variables →
# Actions → New repository secret) con el DSN de Supabase.

on:
  schedule:
    - cron: "0 9 2 * *"   # día 2 de cada mes, 09:00 UTC (~06:00 ART)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install "pandas>=2.2" "pyarrow>=15.0" "psycopg2-binary>=2.9"

      - name: Volcar Supabase → data/historico
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/snapshot_historico.py

      - name: Commitear cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historico
          if git diff --staged --quiet; then
            echo "Sin cambios en el histórico."
          else
            git commit -m "chore: snapshot histórico automático [skip ci]"
            git push
          fi
